name: Lambda Serverless deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Prepare Lambda package
        run: |
          mkdir lambda-package
          cp index.js package.json package-lock.json lambda-package/
          cp -r node_modules lambda-package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::593077778374:role/Git-Lambda-Project
          aws-region: ap-southeast-1

      - name: Deploy Lambda Function
        uses: aws-actions/aws-lambda-deploy@v1
        with:
          function-name: mentorLambdaPractice
          code-artifacts-dir: ./
